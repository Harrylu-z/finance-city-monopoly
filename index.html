<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="description" content="中国金融城 · 像素风大富翁：与三位 AI 争夺金融机构经营权">
<title>中国金融城 · 像素大富翁</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles/tiles.css">
<link rel="stylesheet" href="styles/tiles-3d.css">
<link rel="stylesheet" href="styles/hover-building.css">
<link rel="stylesheet" href="styles/landing-fx.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23f1f5f9'/%3E%3Crect x='3' y='8' width='3' height='5' fill='%23c8392b'/%3E%3Crect x='7' y='5' width='3' height='8' fill='%230f172a'/%3E%3Crect x='11' y='3' width='3' height='10' fill='%232f9fc4'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <!-- ============ 开局界面 ============ -->
  <section id="setup-screen" class="screen">
    <canvas id="setup-bg" class="setup-bg"></canvas>
    <div class="setup-panel pixel-panel">
      <header class="setup-head">
        <div class="logo-row">
          <canvas id="logo-canvas" width="128" height="64" class="logo-canvas" aria-label="中国金融城"></canvas>
          <div class="logo-text">
            <h1>中国金融城</h1>
            <p class="sub">像素大富翁 · 争夺金融机构经营权</p>
          </div>
        </div>
      </header>

      <div class="setup-body">
        <div class="setup-col">
          <label class="field">
            <span class="field-label">你的昵称</span>
            <input id="input-nickname" type="text" maxlength="10" value="你" autocomplete="off">
          </label>

          <div class="field">
            <span class="field-label">选择职业（自带出场被动）</span>
            <div id="career-picker" class="career-picker" role="radiogroup" aria-label="职业"></div>
          </div>

          <div class="field">
            <span class="field-label">难度</span>
            <div id="difficulty-picker" class="seg-picker" role="radiogroup" aria-label="难度"></div>
          </div>

          <div class="field">
            <span class="field-label">AI 数量</span>
            <div id="aicount-picker" class="seg-picker" role="radiogroup" aria-label="AI 数量"></div>
          </div>
        </div>

        <div class="setup-col">
          <div class="field">
            <span class="field-label">骰子数量（点数累加）</span>
            <div id="dice-picker" class="seg-picker" role="radiogroup" aria-label="骰子数量"></div>
          </div>

          <div class="field">
            <span class="field-label">开局资金</span>
            <div id="cash-picker" class="seg-picker" role="radiogroup" aria-label="开局资金"></div>
          </div>

          <div class="field">
            <span class="field-label">市场周期</span>
            <div id="market-picker" class="seg-picker" role="radiogroup" aria-label="市场周期"></div>
          </div>

          <div class="field">
            <span class="field-label">AI 性格（随机分配）</span>
            <div id="ai-preview" class="ai-preview"></div>
          </div>

          <div class="setup-toggles">
            <label class="toggle"><input type="checkbox" id="chk-sound" checked><span>音效</span></label>
            <label class="toggle"><input type="checkbox" id="chk-anim" checked><span>特效</span></label>
            <label class="toggle"><input type="checkbox" id="chk-tutorial" checked><span>教学引导</span></label>
          </div>
        </div>
      </div>

      <footer class="setup-foot">
        <button id="btn-start" class="pixel-btn pixel-btn-primary pixel-btn-lg">开局</button>
        <button id="btn-setup-back" class="pixel-btn pixel-btn-lg" hidden>返回</button>
      </footer>
    </div>
  </section>

  <!-- ============ 主游戏界面 ============ -->
  <section id="game-screen" class="screen" hidden>
    <div id="stage" class="stage">
      <!-- 背景层：始终铺满整个 stage（天际线视差） -->
      <canvas id="stage-bg" class="stage-bg" aria-hidden="true"></canvas>

      <!-- ===== 左侧竖栏：当前玩家卡 → Tab 面板 → 回合播报 ===== -->
      <!-- 整栏宽度 = --left-panel-w；棋盘的 left 由同一变量推导，
           因此棋盘左侧 0 像素被 HUD 覆盖。 -->
      <div id="hud-left" class="hud hud-left">
        <!-- ① 当前玩家卡：**永远显示人类玩家**，不随 AI 回合切换 -->
        <div id="hud-player" class="hud-player">
          <div id="active-player-card" class="active-card pixel-panel">
            <canvas id="active-avatar" class="active-avatar" width="20" height="30" aria-hidden="true"></canvas>
            <div class="active-info">
              <span id="active-player-name" class="active-name">—</span>
              <span id="active-player-cash" class="active-cash">￥0</span>
            </div>
            <span id="active-player-sub" class="active-sub">—</span>
          </div>
          <!-- 贷款 / 债券 / 限时状态提示（仅在有内容时显示） -->
          <div id="active-status" class="active-status" hidden></div>
        </div>

        <!-- ② Tab 面板：玩家关键信息 -->
        <div id="hud-tabs" class="hud-tabs">
          <div id="tab-list" class="tab-list" role="tablist" aria-label="玩家信息">
            <button class="tab-btn" role="tab" id="tab-btn-inst"
                    aria-controls="tab-panel-inst" aria-selected="true" data-tab="inst">我的机构</button>
            <button class="tab-btn" role="tab" id="tab-btn-buff"
                    aria-controls="tab-panel-buff" aria-selected="false" data-tab="buff" tabindex="-1">Buff</button>
            <button class="tab-btn" role="tab" id="tab-btn-loan"
                    aria-controls="tab-panel-loan" aria-selected="false" data-tab="loan" tabindex="-1">贷款</button>
            <button class="tab-btn" role="tab" id="tab-btn-bond"
                    aria-controls="tab-panel-bond" aria-selected="false" data-tab="bond" tabindex="-1">债券</button>
            <button class="tab-btn" role="tab" id="tab-btn-net"
                    aria-controls="tab-panel-net" aria-selected="false" data-tab="net" tabindex="-1">净值</button>
          </div>
          <div class="tab-panels">
            <div id="tab-panel-inst" class="tab-panel" role="tabpanel"
                 aria-labelledby="tab-btn-inst" tabindex="0"></div>
            <div id="tab-panel-buff" class="tab-panel" role="tabpanel"
                 aria-labelledby="tab-btn-buff" tabindex="0" hidden></div>
            <div id="tab-panel-loan" class="tab-panel" role="tabpanel"
                 aria-labelledby="tab-btn-loan" tabindex="0" hidden></div>
            <div id="tab-panel-bond" class="tab-panel" role="tabpanel"
                 aria-labelledby="tab-btn-bond" tabindex="0" hidden></div>
            <div id="tab-panel-net" class="tab-panel" role="tabpanel"
                 aria-labelledby="tab-btn-net" tabindex="0" hidden></div>
          </div>
        </div>

        <!-- ③ 回合播报 —— 贴左下角（margin-top:auto 顶到竖栏底部）
             常驻显示：原先这里有一个折叠切换按钮（#feed-toggle），
             现已删除，播报列表直接铺开、始终可见。 -->
        <div id="hud-feed" class="hud-feed">
          <div id="log-panel" class="log-panel pixel-panel">
            <h3 class="panel-title">回合播报</h3>
            <div id="log-list" class="log-list" role="log" aria-live="polite"></div>
          </div>
        </div>
      </div>

      <!-- ===== 顶部右角：回合数 + 骰子指示 + 排行榜 ===== -->
      <div id="hud-top-right" class="hud hud-top-right">
        <div class="turn-badge pixel-panel">
          <span class="turn-badge-label">回合</span>
          <span id="hud-round" class="turn-badge-num">1</span>
          <span id="hud-market" class="hud-market">震荡</span>
        </div>
        <button id="btn-rank" class="pixel-btn pixel-btn-icon" title="资产排行" aria-label="资产排行">≡</button>
        <button id="btn-3d" class="pixel-btn pixel-btn-icon" title="切换 3D 立体视角" aria-label="切换 3D 立体视角" aria-pressed="false">◱</button>
        <button id="btn-settings" class="pixel-btn pixel-btn-icon" title="设置" aria-label="设置">⚙</button>
      </div>

      <!-- ===== 顶部全宽回合归属条 =====
           谁在行动 —— 一眼可见。
           宽度铺满顶部，按玩家色分段，当前行动者那一段高亮 + 呼吸光晕。
           ⚠ 与左下角「当前玩家卡」分工不同：
              卡片固定显示**人类玩家**（我的资产），
              这条显示的是**当前正在行动的是谁**（可能是 AI）。 -->
      <div id="turn-bar" class="turn-bar" aria-label="回合归属" role="status">
        <div id="turn-bar-track" class="turn-bar-track"></div>
        <div id="turn-bar-owner" class="turn-bar-owner">
          <span class="turn-bar-owner-dot"></span>
          <span id="turn-bar-name" class="turn-bar-owner-name">—</span>
        </div>
      </div>

      <!-- ===== 中栏：棋盘容器（canvas 尺寸由 JS 按此元素测量） ===== -->
      <div id="board-wrap" class="board-wrap">
        <!--
          3D 舞台骨架（PR-A）
          ====================
          三层职责，从外到内：
            #board-wrap    —— 尺寸基准，Canvas 按它测量（永远不参与变换）
            #board-stage   —— 承载 3D 透视倾斜（rotateX 45°）
            #board-pan     —— 承载拖拽平移（translate）

          ⚠ 为什么平移必须在内层：平移是「移动棋盘」，倾斜是「改变视角」。
             若平移在倾斜之外，平移量会被透视投影二次放大，手感失真。

          ⚠ 为什么尺寸基准必须在最外层：Canvas 的 backing store 尺寸
             按 #board-wrap 测量，变换不改变它 —— 这样 3D 切换 / 拖拽
             都不会触发画布重设（重设会清空画布并触发 ResizeObserver 循环）。
        -->
        <div id="board-stage" class="board-stage">
          <div id="board-pan" class="board-pan">
            <canvas id="board-canvas" class="board-canvas" aria-label="棋盘"></canvas>
            <!-- 地块层：34 个 DOM 地块（盖在 canvas 之上，浅色现代数据卡） -->
            <div id="board-tiles" class="board-tiles" role="list" aria-label="地块"></div>
            <!-- hover 立体建筑层（PR-D）：与地块平级，可自由抬到棋盘之上 -->
            <div id="hover-buildings" class="hover-buildings" aria-hidden="true"></div>
            <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
            <div id="dice-tray" class="dice-tray" aria-live="polite"></div>
            <div id="toast-layer" class="toast-layer" aria-live="polite"></div>
            <!-- 移动端：点击地块弹出的详情卡 -->
            <div id="cell-detail" class="cell-detail" hidden></div>
          </div>
        </div>

        <!--
          ===== 真等距 3D 舞台（?board=3d）=====
          Three.js 正交相机 + 35.264° 极角 + 45°+k×90° 方位角。

          ⚠ 默认**不启用** —— 只有 URL 带 `?board=3d` 时才显示并接管渲染。
             旧管线（Canvas 2D + DOM 地块）保持默认可用，
             新管线是「渐进增强」，随时可以退回。
        -->
        <div id="board-iso" class="board-iso" hidden>
          <canvas id="board-iso-canvas" class="board-iso-canvas" aria-label="真等距 3D 棋盘"></canvas>
          <!-- 3D 模式的底部详情条（点击地块后显示） -->
          <div id="iso-detail" class="iso-detail" hidden></div>
          <!-- 左右旋转按钮（与手势共用 snapTo 入口） -->
          <div id="iso-rotate" class="iso-rotate">
            <button id="iso-rot-l" class="iso-rot-btn" type="button" title="逆时针旋转 90°" aria-label="逆时针旋转 90°">⟲</button>
            <button id="iso-rot-r" class="iso-rot-btn" type="button" title="顺时针旋转 90°" aria-label="顺时针旋转 90°">⟳</button>
          </div>
        </div>
      </div>

      <!-- ===== 底部中央：主行动按钮 + 常用操作（常驻，不再收进抽屉） ===== -->
      <div id="hud-bottom" class="hud hud-bottom">
        <div class="bottom-bar pixel-panel">
          <button id="btn-roll" class="pixel-btn pixel-btn-primary pixel-btn-primary-xl">掷 骰 子</button>
          <span class="bottom-sep" aria-hidden="true"></span>
          <button id="btn-assets" class="pixel-btn bottom-act">我的机构</button>
          <button id="btn-mortgage" class="pixel-btn bottom-act">质押融资</button>
          <button id="btn-endturn" class="pixel-btn bottom-act bottom-act-end">结束回合</button>
        </div>
      </div>

      <!-- ===== 右侧：资产排行 + 全玩家财务对比（常驻面板，窄屏自动收起） ===== -->
      <aside id="hud-right" class="hud hud-right">
        <div class="side-panel pixel-panel">
          <div class="panel-title">资产排行</div>
          <div id="rank-side" class="rank-list rank-list-side"></div>
          <div class="panel-title">财务对比</div>
          <div id="fin-compare" class="fin-compare"></div>
          <div class="side-note">点击排行任意一行可查看该玩家完整财务指标</div>
        </div>
      </aside>

    </div>
  </section>

  <!-- ============ 资产排行弹窗（不常驻） ============ -->
  <div id="rank-root" class="modal-root" hidden>
    <div id="rank-backdrop" class="modal-backdrop"></div>
    <div id="rank-box" class="modal-box pixel-panel" role="dialog" aria-modal="true" aria-label="资产排行">
      <h2 class="modal-title">资产排行</h2>
      <div id="rank-list" class="rank-list rank-list-modal"></div>
      <!-- ===== 菜单分组（原「菜单」按钮的功能迁移到此）===== -->
      <div class="rank-menu">
        <div class="panel-title">菜单</div>
        <div class="rank-menu-grid">
          <button id="btn-menu-share" class="pixel-btn rank-menu-btn">分享战绩</button>
          <button id="btn-menu-assets" class="pixel-btn rank-menu-btn">我的机构</button>
          <button id="btn-menu-metrics" class="pixel-btn rank-menu-btn">财务指标总览</button>
          <button id="btn-menu-sound" class="pixel-btn rank-menu-btn">音效：开</button>
          <button id="btn-menu-anim" class="pixel-btn rank-menu-btn">特效：开</button>
          <button id="btn-menu-theme" class="pixel-btn rank-menu-btn">主题：暗色</button>
          <button id="btn-menu-selftest" class="pixel-btn rank-menu-btn">规则引擎自检</button>
          <button id="btn-menu-setup" class="pixel-btn rank-menu-btn">返回开局界面</button>
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-rank-close" class="pixel-btn">关闭</button>
      </div>
    </div>
  </div>

  <!-- ============ 私人赌场 · 德州扑克 ============ -->
  <div id="poker-root" class="modal-root poker-root" hidden>
    <div id="poker-backdrop" class="modal-backdrop"></div>
    <div id="poker-box" class="poker-box pixel-panel" role="dialog" aria-modal="true" aria-label="私人赌场 · 德州扑克"></div>
  </div>

  <!-- ============ 通用弹窗 ============ -->
  <div id="modal-root" class="modal-root" hidden>
    <div id="modal-backdrop" class="modal-backdrop"></div>
    <div id="modal-box" class="modal-box pixel-panel" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ============ 分享弹窗 ============ -->
  <div id="share-root" class="modal-root" hidden>
    <div id="share-backdrop" class="modal-backdrop"></div>
    <div id="share-box" class="share-box pixel-panel" role="dialog" aria-modal="true">
      <h2 class="panel-title">分享战绩</h2>
      <canvas id="share-canvas" width="480" height="300" class="share-canvas"></canvas>
      <div class="share-links">
        <label class="field">
          <span class="field-label">深链接（可复现同图局）</span>
          <input id="share-url" type="text" readonly>
        </label>
        <div class="share-btns">
          <button id="btn-copy-url" class="pixel-btn pixel-btn-primary">复制链接</button>
          <button id="btn-dl-card" class="pixel-btn">下载分享图</button>
          <button id="btn-copy-embed" class="pixel-btn">复制嵌入代码</button>
        </div>
        <details class="embed-box">
          <summary>iframe 嵌入代码</summary>
          <textarea id="embed-code" rows="4" readonly></textarea>
        </details>
      </div>
      <button id="btn-share-close" class="pixel-btn">关闭</button>
    </div>
  </div>

  <!-- ============ 浏览器内自检 ============ -->
  <section id="selftest-screen" class="screen" hidden>
    <div class="setup-panel pixel-panel selftest-panel">
      <h1 class="panel-title">规则引擎自检</h1>
      <div id="selftest-output" class="selftest-output"></div>
      <button id="btn-selftest-back" class="pixel-btn pixel-btn-primary">返回</button>
    </div>
  </section>
</div>

<script type="module" src="src/app/main.js"></script>
</body>
</html>
