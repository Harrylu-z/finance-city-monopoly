<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="description" content="中国金融城 · 像素风大富翁：与三位 AI 争夺金融机构经营权">
<title>中国金融城 · 像素大富翁</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23161b2e'/%3E%3Crect x='3' y='8' width='3' height='5' fill='%23e0a53f'/%3E%3Crect x='7' y='5' width='3' height='8' fill='%23f2e6cf'/%3E%3Crect x='11' y='3' width='3' height='10' fill='%23c8392b'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <!-- ============ 开局界面 ============ -->
  <section id="setup-screen" class="screen">
    <canvas id="setup-bg" class="setup-bg"></canvas>
    <div class="setup-panel pixel-panel">
      <header class="setup-head">
        <div class="logo-row">
          <canvas id="logo-canvas" width="128" height="64" class="logo-canvas" aria-label="中国金融城"></canvas>
          <div class="logo-text">
            <h1>中国金融城</h1>
            <p class="sub">像素大富翁 · 争夺金融机构经营权</p>
          </div>
        </div>
      </header>

      <div class="setup-body">
        <div class="setup-col">
          <label class="field">
            <span class="field-label">你的昵称</span>
            <input id="input-nickname" type="text" maxlength="10" value="你" autocomplete="off">
          </label>

          <div class="field">
            <span class="field-label">选择棋子形象</span>
            <div id="avatar-picker" class="avatar-picker" role="radiogroup" aria-label="棋子形象"></div>
          </div>

          <div class="field">
            <span class="field-label">难度</span>
            <div id="difficulty-picker" class="seg-picker" role="radiogroup" aria-label="难度"></div>
          </div>

          <div class="field">
            <span class="field-label">AI 数量</span>
            <div id="aicount-picker" class="seg-picker" role="radiogroup" aria-label="AI 数量"></div>
          </div>

          <div class="field">
            <span class="field-label">题材皮肤</span>
            <div id="theme-picker" class="seg-picker" role="radiogroup" aria-label="题材皮肤"></div>
          </div>

          <div class="field">
            <span class="field-label">局长设定</span>
            <div id="rounds-picker" class="seg-picker" role="radiogroup" aria-label="局长设定"></div>
          </div>
        </div>

        <div class="setup-col">
          <div class="field">
            <span class="field-label">骰子数量（点数累加）</span>
            <div id="dice-picker" class="seg-picker" role="radiogroup" aria-label="骰子数量"></div>
          </div>

          <div class="field">
            <span class="field-label">开局资金</span>
            <div id="cash-picker" class="seg-picker" role="radiogroup" aria-label="开局资金"></div>
          </div>

          <div class="field">
            <span class="field-label">市场周期</span>
            <div id="market-picker" class="seg-picker" role="radiogroup" aria-label="市场周期"></div>
          </div>

          <div class="field">
            <span class="field-label">AI 性格（随机分配）</span>
            <div id="ai-preview" class="ai-preview"></div>
          </div>

          <div class="setup-toggles">
            <label class="toggle"><input type="checkbox" id="chk-sound" checked><span>音效</span></label>
            <label class="toggle"><input type="checkbox" id="chk-anim" checked><span>特效</span></label>
            <label class="toggle"><input type="checkbox" id="chk-tutorial" checked><span>教学引导</span></label>
          </div>
        </div>
      </div>

      <footer class="setup-foot">
        <button id="btn-start" class="pixel-btn pixel-btn-primary pixel-btn-lg">开局</button>
        <button id="btn-setup-back" class="pixel-btn pixel-btn-lg" hidden>返回</button>
      </footer>
    </div>
  </section>

  <!-- ============ 主游戏界面 ============ -->
  <section id="game-screen" class="screen" hidden>
    <div id="stage" class="stage">
      <!-- 背景层：始终铺满整个 stage（天际线视差） -->
      <canvas id="stage-bg" class="stage-bg" aria-hidden="true"></canvas>

      <!-- 顶部条：回合信息 + 图标按钮 -->
      <div id="hud-top" class="hud hud-top">
        <div class="hud-turn pixel-panel">
          <span id="hud-turn-label" class="hud-turn-label">当前回合</span>
          <span id="hud-turn-name" class="hud-turn-name">—</span>
          <span id="hud-market" class="hud-market">市场：—</span>
        </div>
        <div class="hud-actions">
          <button id="btn-sound" class="pixel-btn pixel-btn-icon" title="音效开关" aria-label="音效开关">♪</button>
          <button id="btn-anim" class="pixel-btn pixel-btn-icon" title="特效开关" aria-label="特效开关">✦</button>
          <button id="btn-theme" class="pixel-btn pixel-btn-icon" title="主题" aria-label="主题">◐</button>
          <button id="btn-menu" class="pixel-btn pixel-btn-icon" title="菜单" aria-label="菜单">≡</button>
        </div>
      </div>

      <!-- 左栏：玩家信息 -->
      <div id="player-cards" class="player-cards"></div>

      <!-- 中栏：棋盘容器（canvas 尺寸由 JS 按此元素测量） -->
      <div id="board-wrap" class="board-wrap">
        <canvas id="board-canvas" class="board-canvas" aria-label="棋盘"></canvas>
        <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
        <div id="dice-tray" class="dice-tray" aria-live="polite"></div>
        <div id="toast-layer" class="toast-layer" aria-live="polite"></div>
      </div>

      <!-- 右栏：资产排行 + 行情灯带 -->
      <div id="hud-right" class="hud hud-right">
        <div class="rank-panel pixel-panel">
          <h3 class="panel-title">资产排行</h3>
          <div id="rank-list" class="rank-list"></div>
        </div>
        <div id="market-kline" class="kline-panel pixel-panel">
          <h3 class="panel-title">行情灯带</h3>
          <canvas id="kline-canvas" width="180" height="46"></canvas>
        </div>
      </div>

      <!-- 底部条：回合播报 + 动作按钮 -->
      <div id="hud-bottom" class="hud hud-bottom">
        <div class="log-panel pixel-panel">
          <h3 class="panel-title">回合播报</h3>
          <div id="log-list" class="log-list" role="log" aria-live="polite"></div>
        </div>
        <div class="action-bar">
          <button id="btn-roll" class="pixel-btn pixel-btn-primary pixel-btn-lg">掷 骰 子</button>
          <button id="btn-assets" class="pixel-btn pixel-btn-lg">我的机构</button>
          <button id="btn-mortgage" class="pixel-btn pixel-btn-lg">质押融资</button>
          <button id="btn-endturn" class="pixel-btn pixel-btn-lg">结束回合</button>
        </div>
      </div>

    </div>
  </section>

  <!-- ============ 通用弹窗 ============ -->
  <div id="modal-root" class="modal-root" hidden>
    <div id="modal-backdrop" class="modal-backdrop"></div>
    <div id="modal-box" class="modal-box pixel-panel" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ============ 分享弹窗 ============ -->
  <div id="share-root" class="modal-root" hidden>
    <div id="share-backdrop" class="modal-backdrop"></div>
    <div id="share-box" class="share-box pixel-panel" role="dialog" aria-modal="true">
      <h2 class="panel-title">分享战绩</h2>
      <canvas id="share-canvas" width="480" height="300" class="share-canvas"></canvas>
      <div class="share-links">
        <label class="field">
          <span class="field-label">深链接（可复现同图局）</span>
          <input id="share-url" type="text" readonly>
        </label>
        <div class="share-btns">
          <button id="btn-copy-url" class="pixel-btn pixel-btn-primary">复制链接</button>
          <button id="btn-dl-card" class="pixel-btn">下载分享图</button>
          <button id="btn-copy-embed" class="pixel-btn">复制嵌入代码</button>
        </div>
        <details class="embed-box">
          <summary>iframe 嵌入代码</summary>
          <textarea id="embed-code" rows="4" readonly></textarea>
        </details>
      </div>
      <button id="btn-share-close" class="pixel-btn">关闭</button>
    </div>
  </div>

  <!-- ============ 浏览器内自检 ============ -->
  <section id="selftest-screen" class="screen" hidden>
    <div class="setup-panel pixel-panel selftest-panel">
      <h1 class="panel-title">规则引擎自检</h1>
      <div id="selftest-output" class="selftest-output"></div>
      <button id="btn-selftest-back" class="pixel-btn pixel-btn-primary">返回</button>
    </div>
  </section>
</div>

<script type="module" src="src/app/main.js"></script>
</body>
</html>
